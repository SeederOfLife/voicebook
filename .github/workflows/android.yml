name: Android app
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", "ci/**", ".github/workflows/android.yml"]
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
env:
  SHERPA_VERSION: "1.13.8"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Native voice library (sherpa-onnx)
        run: |
          mkdir -p android/app/libs
          curl -sSL --fail -o android/app/libs/sherpa-onnx.aar \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/v${SHERPA_VERSION}/sherpa-onnx-${SHERPA_VERSION}.aar"
      - name: Build the APK
        working-directory: android
        shell: bash
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.${{ github.run_number }}"
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          cp app/build/outputs/apk/release/app-release.apk ../voicebook.apk
          ls -la ../voicebook.apk
      - name: Publish the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "{\"versionCode\": ${{ github.run_number }}, \"versionName\": \"1.${{ github.run_number }}\", \"commit\": \"${GITHUB_SHA::7}\"}" > version.json
          gh release view android >/dev/null 2>&1 || gh release create android --title "Voicebook for Android" \
            --notes "Download voicebook.apk on your Android phone and open it to install. New versions replace this file."
          gh release upload android voicebook.apk version.json --clobber
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: voicebook.apk, retention-days: 3 }
      - name: Share the build log if it failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ci-logs >/dev/null 2>&1 || gh release create ci-logs --prerelease --title "Build logs" --notes "Logs of the Android build, for troubleshooting."
          (grep -n -E "^e: |error:|FAILURE|What went wrong" -A6 android/build.log | head -200; echo ----; tail -150 android/build.log) > build-log.txt || true
          gh release upload ci-logs build-log.txt --clobber

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: apk }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash ci/emulator-test.sh
      - name: Share the test results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ci-check >/dev/null 2>&1 || gh release create ci-check --prerelease --title "Emulator test" --notes "Screenshots, voice sample and logs from the latest emulator test."
          ls -la out || true
          gh release upload ci-check out/* --clobber || true
